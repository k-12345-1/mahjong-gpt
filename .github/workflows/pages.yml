# The served site is built, not committed: build.sh wraps index.html in a document and
# copies beside it only what the browser actually asks for. So Pages builds it here.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# A push while one is deploying should win, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - id: deploy
        uses: actions/deploy-pages@v4
