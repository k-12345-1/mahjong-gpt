<style>
/* Layout: a lacquer table. Giant Didone sets the name, mono carries every label and
   number, and the hand you are playing sits on it as pale paper objects. */
:root{
  /* The ground, read off the dragon photograph: a deep lacquer that falls away to
     near-black at the edges, rather than the brighter vermilion it was. */
  --lacquer:#9c0400; --lacquer-deep:#6e0200;
  /* The ground is a slow gradient over a narrow range of red -- about forty levels
     across a whole screen -- so eight-bit colour lays it down in visible bands. A
     faint grain over the top dithers them away; it is too fine to read as texture. */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.055'/></svg>");
  --ground:var(--grain) repeat,radial-gradient(118% 92% at 50% 44%,var(--lacquer) 0%,var(--lacquer) 34%,var(--lacquer-deep) 100%);
  --chalk:#e9e6e6; --chalk-2:#d7d4d4; --chalk-3:#c9c5c5;
  --paper:#f4f1ec; --ink:#202020; --ink-soft:#6b6460;
  --rule:rgba(233,230,230,.26); --rule-ink:rgba(32,32,32,.14);
  --tile:#fcfbf8; --tile-line:#24211e; --tile-shade:#cfc9bf;
  --green:#0f6b3f; --gold:#a97a26;
  --display:'Instrument Serif','Didot','Bodoni MT',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --cjk:'Songti TC','Noto Serif CJK TC','PingFang TC','Hiragino Sans GB','Microsoft JhengHei',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* white scrollbar on the lacquer; ink inside the paper panels so it stays visible */
html{scrollbar-color:#fff rgba(0,0,0,.28);scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.28)}
::-webkit-scrollbar-thumb{background:#fff;border-radius:999px;border:2px solid rgba(0,0,0,.28);
  background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#fff;background-clip:padding-box}
::-webkit-scrollbar-corner{background:rgba(0,0,0,.28)}
.panel{scrollbar-color:var(--ink) rgba(32,32,32,.12)}
.panel ::-webkit-scrollbar-track,.panel::-webkit-scrollbar-track{background:rgba(32,32,32,.12)}
.panel ::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb{background:var(--ink);
  border-color:rgba(32,32,32,.12)}
html,body{background:var(--lacquer)}
body{color:var(--chalk);font-family:var(--mono);font-size:13.5px;line-height:1.6;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:.94;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--chalk);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-3)}
.cjk{font-family:var(--cjk)}

/* ---- hero: the name, nothing else ---- */
.hero{position:relative;width:100%;height:100vh;height:100dvh;min-height:320px;overflow:hidden;
  isolation:isolate;
  background:var(--ground);user-select:none;-webkit-user-select:none}
.hero-centre{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
/* Two dragon layers. The still one sits behind the type and is what you get with reduced
   motion, or before the canvas has its image; the canvas overlay replaces it once it is
   actually drawing, and passes IN FRONT of the title. Menu and Play outrank both. */
/* The dragon is off the hero for now: its markup is commented out in the header below
   and nothing mounts the canvas, so these rules are dormant until it goes back. */
.dragon-static{--bleed:13vw;position:absolute;z-index:1;left:calc(var(--bleed)*-1);bottom:-7vh;
  height:128vh;width:max-content;pointer-events:none}
.dragon{display:block;height:100%;width:auto;opacity:.66;-webkit-user-drag:none}
@keyframes settleIn{from{opacity:0}}
/* The dragon waits for the T to land -- it is the last letter, so that is also when the
   wordmark is done. --after-title is set in JS from the same constants that stagger the
   letters, so it cannot drift if the wordmark changes. `backwards` holds it at zero
   through the wait; under reduced motion the title does not rise, so neither does it. */
@media (prefers-reduced-motion:no-preference){
  .dragon,.dragon-swim,.dragon-stage{
    animation:settleIn .8s ease-out var(--after-title,1.455s) backwards}
}
.hero.swimming .dragon-static{display:none}
.dragon-swim{position:absolute;inset:0;width:100%;height:100%;display:block;
  pointer-events:none;z-index:3;opacity:.95;
  filter:drop-shadow(0 16px 20px rgba(32,2,0,.5)) drop-shadow(0 3px 5px rgba(32,2,0,.4))}
@media (prefers-reduced-motion:reduce){.dragon-swim{display:none}}
/* The 3D dragon's own layer. It sits in front of the wordmark, the way the supplied
   landing page has it; the menu button stays above both. */
.dragon-swim-layer{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.dragon-swim-layer[hidden]{display:none}
/* The dragon as supplied: a page of its own, running its own scene, carried on the hero
   in a frame of its own. ?embed drops its chrome and its backdrop, so what is left is the
   creature on this page's red. It is in front of the wordmark, as the one before it was.
   It takes no input at all: this is a creature swimming past, not a toy to be handled, and
   a frame that answered the pointer would swallow a drag across the hero -- which on a
   touch screen is the page being scrolled. */
.dragon-stage{position:absolute;inset:0;width:100%;height:100%;z-index:3;border:0;
  background:transparent;pointer-events:none}
@media (prefers-reduced-motion:reduce){.dragon-stage{display:none}}
.hero-stage{position:relative;font-family:var(--display);font-weight:400;color:#fff;
  text-transform:uppercase;line-height:.98;letter-spacing:-.045em;
  --dfs:min(24.25vw,43vh);font-size:var(--dfs)}
.hero-line{display:block;position:relative;white-space:nowrap}
.hero-row-b{position:relative;text-align:center}
.hero-line.b{position:relative;display:inline-block}
/* each letter rises out of a clipped word box, 45ms apart */
/* The clip is what hides the letters until they rise into the line. Its bottom used
   to sit exactly on the box, which cut the word's own shadow off in a straight line
   across the red -- the shadow falls 10px with a 26px blur, so it needs the room. */
.word{display:block;clip-path:inset(-50% -.5em -48px);margin-bottom:-.08em;padding-bottom:.08em;padding-right:.08em;
  text-shadow:0 10px 26px rgba(32,2,0,.42),0 2px 4px rgba(32,2,0,.3)}
.word i{display:inline-block;font-style:normal}
@media (prefers-reduced-motion:no-preference){
  /* No will-change here. It gave every letter a layer of its own, and the word's soft
     shadow was then cut off square at each letter's layer edge -- which drew a row of
     rectangles on the ground behind the type. The browser promotes a running transform
     animation anyway, so the hint bought nothing and the layers were never given back. */
  .word i{transform:translateY(110%);opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes rise{to{transform:none;opacity:1}}
}
.ui-chip{position:absolute;z-index:30;display:inline-flex;align-items:center;
  font-family:var(--mono);font-weight:500;text-transform:uppercase;white-space:nowrap;border:0;border-radius:max(6px,.5vw);height:max(40px,3.6vw);padding:0 max(16px,1.6vw);
  font-size:max(.7rem,.85vw);letter-spacing:.08em;background:rgba(0,0,0,.3);color:#fff;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transition:background .15s ease,transform .1s ease}
button.ui-chip{cursor:pointer}
button.ui-chip:hover{background:rgba(0,0,0,.45)}
button.ui-chip:active{transform:scale(.97)}
.ui-tr{right:max(2.5vw,env(safe-area-inset-right,0px));top:max(2.5vw,env(safe-area-inset-top,0px))}
/* ---- menu button and the full-screen menu it opens ---- */
.menu-btn{position:fixed;z-index:40;display:inline-flex;align-items:center;justify-content:center;
  border-radius:max(8px,.75vw);width:max(44px,4vw);height:max(44px,4vw);
  background:#fff;color:#202020;border:0;cursor:pointer;transition:background .15s ease,transform .1s ease}
.menu-btn:hover{background:#e9e6e6}
.menu-btn:active{transform:scale(.95)}
.menu-btn svg{width:42%;height:42%}
.menu{position:fixed;inset:0;z-index:35;display:flex;align-items:center;
  background:var(--ground)}
.menu-body{width:100%;max-width:none;padding:0 6vw 0 11vw}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.2vw}
.menu a{display:inline-block;font-family:var(--display);font-weight:400;color:#fff;
  font-size:min(9vw,14vh);line-height:1;letter-spacing:0;text-transform:uppercase;
  text-decoration:none;transition:transform .15s ease,opacity .15s ease}
.menu a:hover{transform:translateX(.05em);opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .menu li{opacity:0;animation:menuIn .45s ease-out forwards}
  @keyframes menuIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}
/* Everything but Home goes to a blank red page. It covers the hero but stays under the menu
   button and the menu itself, so the only thing on it is the hamburger, and the menu is the
   way off. */
.blank-page{position:fixed;inset:0;z-index:32;background:var(--ground)}
.ui-bl{left:max(2.5vw,env(safe-area-inset-left,0px));bottom:calc(3.5vh + env(safe-area-inset-bottom,0px))}
.ui-br{right:max(2.5vw,env(safe-area-inset-right,0px));bottom:calc(3.5vh + env(safe-area-inset-bottom,0px))}
@media (max-width:640px){
  .dragon-static{--bleed:22vw;height:71vh;bottom:0}
  .dragon{opacity:.54}.dragon-swim{opacity:.92}
  .menu-body{max-width:100vw;padding:0 max(16px,env(safe-area-inset-left,0px))}
  .menu ul{gap:2.2vh}
  .menu a{font-size:clamp(2rem,12vw,9vh)}
  .hero-stage{--dfs:23.3vw}
  .ui-tr{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
  .ui-bl{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .ui-br{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:480px){.hero-stage{--dfs:min(24.25vw,36vh)}}

<style>
/* ---- tiles: white face, thin dark edge, a little depth ---- */
.tile{position:relative;flex:0 0 auto;width:40px;height:54px;border-radius:5px;background:var(--tile);
  border:1px solid var(--tile-line);border-bottom:3px solid var(--tile-shade);color:#1d1a17;
  padding:0;display:grid;place-items:center;font-family:var(--cjk);line-height:1;overflow:hidden;
  box-shadow:0 2px 3px rgba(0,0,0,.28)}
button.tile{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
button.tile:hover{transform:translateY(-5px);box-shadow:0 9px 14px rgba(0,0,0,.42)}
button.tile[disabled]{cursor:default;transform:none}
.tile svg{width:100%;height:100%;display:block}
.tile .glyph{font-size:27px;font-weight:500}
.tile .wan{display:grid;line-height:.9;text-align:center;gap:1px}
.tile .wan i{font-style:normal;font-size:.85em}
.tile .wan em{font-style:normal;font-size:.68em;color:#bf2318;font-weight:600}
.tile.sm{width:32px;height:43px}.tile.sm .glyph{font-size:21px}
.tile.xs{width:25px;height:34px}.tile.xs .glyph{font-size:17px}
.tile.back{background:linear-gradient(165deg,#2f8f5f,#135c3c);border-color:#0d4630;border-bottom-color:#0a3524}
.tile.back::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.22);border-radius:3px}
.tile.drawn{box-shadow:0 0 0 2px var(--gold),0 2px 3px rgba(0,0,0,.28)}
.tile.live{box-shadow:0 0 0 2px #fff,0 2px 3px rgba(0,0,0,.28)}
@media (max-width:640px){
  .tile{width:31px;height:43px}.tile .glyph{font-size:21px}
  .tile.sm{width:25px;height:34px}.tile.sm .glyph{font-size:17px}
  .tile.xs{width:21px;height:28px}.tile.xs .glyph{font-size:14px}
}

/* ---- the table ---- */
.play .wrap{padding-block:clamp(26px,4.4vw,46px) clamp(30px,5vw,56px)}
.play-head{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;justify-content:space-between;
  margin-bottom:20px}
.play-head h2{font-size:clamp(26px,4.4vw,42px);color:var(--chalk)}
.play-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.felt{border:1px solid var(--rule);border-radius:10px;background:rgba(0,0,0,.28);padding:4px;
  display:flex;flex-direction:column}
.seat{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 14px;align-items:center;
  padding:10px;border-radius:7px;border-left:2px solid transparent;min-width:0}
.seat+.seat{box-shadow:inset 0 1px 0 var(--rule)}
/* whose turn it is has to read at a glance, so it gets an edge, not just a wash */
.seat.turn{background:rgba(255,255,255,.07);border-left-color:var(--gold)}
.seat-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.seat-id .w{font-family:var(--cjk);font-size:21px;line-height:1;color:var(--chalk)}
.seat-id .n{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-3);
  min-height:11px}
.seat-hand{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center;min-width:0}
.set{display:flex;gap:2px}
/* a hand you cannot see is still a hand: backs overlap the way a held hand does */
.backs{display:flex}
.backs .tile{margin-left:-9px}
.backs .tile:first-child{margin-left:0}
/* the pond is a place on the table, so it gets a sunk surface and keeps its own shape */
.seat-pond{display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;width:165px;
  padding:6px;border-radius:6px;background:rgba(0,0,0,.32);min-height:40px}
.seat-pond .tile{opacity:.76}
.seat-pond .tile:last-child{opacity:1;box-shadow:0 0 0 1.5px var(--chalk-3),0 2px 3px rgba(0,0,0,.28)}
.my-rack{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;min-width:0;margin-top:4px;
  padding-top:10px;border-top:1px solid var(--rule)}
@media (max-width:640px){
  .seat{grid-template-columns:38px minmax(0,1fr);gap:6px 10px;padding:9px 8px}
  .seat-pond{grid-column:1/-1;width:auto}
}
.my-rack .tile{animation:deal .16s ease-out}
@keyframes deal{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.gap{width:10px}

.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;min-height:38px}
.btn{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:var(--chalk);color:var(--lacquer-deep);border:1px solid var(--chalk);border-radius:6px;
  padding:9px 15px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fff}
.btn.ghost{background:none;color:var(--chalk-2);border-color:var(--rule)}
.btn.ghost:hover{background:rgba(0,0,0,.2);color:var(--chalk)}
.btn.go{background:var(--gold);border-color:var(--gold);color:#1d1408}
.btn .cjk{font-size:14px;letter-spacing:0;margin-right:.3em}
.hint{font-size:11.5px;color:var(--chalk-3)}

/* ---- the coach's live reading ---- */
.readout{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:18px}
.panel{background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 16px;min-width:0}
.panel h3{font-family:var(--display);font-size:22px;color:var(--ink);margin-bottom:2px}
.panel .eyebrow{color:var(--ink-soft);display:block;margin-bottom:10px}
.panel p{font-size:12px;color:var(--ink-soft);margin-top:10px}
.panel p b{color:var(--ink);font-weight:600}
.big{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:.9;color:var(--lacquer);
  font-variant-numeric:tabular-nums}
.big small{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-top:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);padding:0 12px 7px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:7px 12px 7px 0;border-bottom:1px solid var(--rule-ink);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{padding-right:0}
.num{text-align:right;white-space:nowrap}
.cjk-cell{font-family:var(--cjk);font-size:13px}
.faan-n{font-weight:600;color:var(--gold)}
.risk{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.r-safe{color:var(--green);border-color:var(--green)}
.r-fair{color:var(--ink-soft);border-color:var(--rule-ink)}

.r-hot{color:var(--lacquer);border-color:var(--lacquer);background:rgba(156,4,0,.08)}
.threat{margin-top:10px;font-size:11.5px;color:var(--ink-soft);border-left:2px solid var(--lacquer);
  padding-left:10px}

.best td{background:rgba(15,107,63,.08)}
.tilerow{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.total{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin-top:12px;
  padding-top:11px;border-top:2px solid var(--ink);font-family:var(--display);font-size:21px}
.total .n{color:var(--lacquer);font-variant-numeric:tabular-nums}
.payout{margin-top:11px;font-size:11.5px;color:var(--ink-soft);border-left:2px solid var(--gold);padding-left:11px}

/* ---- the coach, handed the live table ---- */
function handState() {
  var me = g.seats[HKG.HUMAN], ctx = HKG.ctxFor(g, HKG.HUMAN), L = [];
  L.push('Seat ' + HKG.WIND[HKG.seatWind(g, HKG.HUMAN)] + ' · round ' + HKG.WIND[g.round] +
    ' · ' + g.wall.length + ' tiles left in the wall');
  L.push('Your rack: ' + (E.formatHand(me.counts, []) || 'empty'));
  if (me.melds.length) {
    L.push('Laid down: ' + me.melds.map(function (m) {
      return (m.concealed ? 'concealed ' : 'exposed ') + m.type + ' of ' + E.tileName(m.tile);
    }).join(', ') + ' (so the hand is ' + (ctx.concealed ? 'still 門前清' : 'no longer 門前清') + ')');
  }
  [1, 2, 3].forEach(function (s) {
    var o = g.seats[s], fs = HKG.flushSuit(g, s);
    L.push(HKG.WIND[HKG.seatWind(g, s)] + ' threat ' + HKG.threat(g, s).toFixed(2) +
      (fs !== null ? ' (reads as a ' + E.SUIT_CH[fs] + ' flush chase)' : ''));
    L.push(HKG.WIND[HKG.seatWind(g, s)] + ' has thrown: ' +
      (o.discards.map(E.tileName).join(' ') || 'nothing yet') +
      (o.melds.length ? ' · laid down ' + o.melds.map(function (m) {
        return m.type + ' of ' + E.tileName(m.tile); }).join(', ') : ''));
  });
  if (g.phase === 'over') {
    var r = g.result;
    L.push(r.seat === null ? 'The hand was a draw.' :
      (r.seat === HKG.HUMAN ? 'You won' : HKG.WIND[HKG.seatWind(g, r.seat)] + ' won') + ' with ' +
      r.score.faan + ' faan: ' + r.score.patterns.map(function (p) {
        return faanName(p.key) + ' ' + faanEn(p.key) + ' +' + p.faan; }).join('; '));
    return L.join('\n');
  }
  var full = HKG.handSize(me), n = E.total(me.counts);
  if (n === full) {
    var ds = E.discards(me.counts, ctx);
    L.push('It is your turn. Discards, best first (shanten = tiles from tenpai, live = copies left that help,');
    L.push('risk = how likely that throw feeds an opponent, judged only from what is face-up):');
    ds.slice(0, 6).forEach(function (d) {
      var rk = HKG.risk(g, HKG.HUMAN, d.tile);
      L.push('  throw ' + E.tileName(d.tile) + ' -> ' + d.shanten + ' shanten, ' + d.live + ' live, risk ' +
        rk.word + ' (' + rk.score.toFixed(2) + (rk.why ? ', vs ' + rk.why : '') + '), accepts ' +
        d.waits.map(function (w) { return E.tileName(w.tile) + (w.winning ? '(wins ' + w.faan + ' faan)' : ''); }).join(' '));
    });
  } else {
    var u = E.ukeire(me.counts, ctx);
    L.push(u.shanten === 0 ? 'You are TENPAI. Winning tiles:' : u.shanten + ' shanten. Tiles that help:');
    u.tiles.forEach(function (t) {
      L.push('  ' + E.tileName(t.tile) + ' — ' + t.live + ' left' + (t.winning ?
        ', wins for ' + t.faan + ' faan (' + t.patterns.map(function (p) { return faanName(p.key); }).join('、') + ')' : ''));
    });
  }
  if (g.offer) {
    L.push('You are being offered: ' + g.offer.claims.map(function (c) {
      return CLAIM_CN[c.kind] + ' ' + c.kind + (c.tile !== null && c.tile !== undefined ? ' on ' + E.tileName(c.tile) : '');
    }).join(', '));
  }
  return L.join('\n');
}

var COACH_RULES = [
  'You are a Hong Kong mahjong coach (廣東麻雀, HK old style, 13-faan limit) sitting behind a beginner',
  'while they play a hand. A deterministic engine has already analysed the table. The numbers under',
  'TABLE are correct: never recompute, contradict or invent faan values, shanten counts or tile counts.',
  'Be concrete and short — under 130 words unless asked for more. Name tiles as the engine does (3筒, 中, 東).',
  'Name a pattern in Chinese with the English in brackets the first time it comes up.',
  'Say what you would do and what it costs. Plain prose, short paragraphs; a dash list only when',
  'comparing options. No headings. Reply in the language the player wrote in.'
].join(' ');

function inlineFmt(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function fmt(text) {
  var esc = String(text).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
  return esc.split(/\n{2,}/).map(function (block) {
    var lines = block.split('\n').filter(function (l) { return l.trim(); });
    if (!lines.length) return '';
    if (lines.every(function (l) { return /^\s*[-•*]\s+/.test(l); })) {
      return '<ul>' + lines.map(function (l) { return '<li>' + inlineFmt(l.replace(/^\s*[-•*]\s+/, '')) + '</li>'; }).join('') + '</ul>';
    }
    return '<p>' + inlineFmt(lines.join('<br>')) + '</p>';
  }).join('');
}
function bubble(role, html) {
  var d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'you' : 'coach');
  d.innerHTML = role === 'user' ? '' : '<div class="who">Coach</div>';
  var body = document.createElement('div');
  body.innerHTML = html;
  d.appendChild(body);
  $('#thread').appendChild(d);
  $('#thread').scrollTop = $('#thread').scrollHeight;
  return body;
}
function renderPrompts() {
  var host = $('#prompts');
  if (host.hidden || !g) return;
  var me = g.seats[HKG.HUMAN], list;
  if (g.phase === 'over') list = ['Explain that faan count simply.', 'What should I have done differently?'];
  else if (g.offer) list = ['Should I take it?', '點解唔好碰？', 'What does claiming cost me?'];
  else if (E.total(me.counts) === HKG.handSize(me)) list = ['打邊隻好？點解？', 'Is a flush worth chasing here?', 'Which throw is dangerous?'];
  else list = ['What am I waiting for?', 'What are the others collecting?', 'How do I read the discards?'];
  host.innerHTML = '';
  list.forEach(function (q) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = q;
    b.addEventListener('click', function () { ask(q); });
    host.appendChild(b);
  });
}
function ask(question) {
  if (asking || !sampler || !question.trim()) return;
  asking = true;
  $('#askBtn').disabled = true;
  $('#askInput').value = '';
  bubble('user', fmt(question));
  var body = bubble('coach', '<p class="dots">Reading the table</p>');
  var turns = chat.slice(-6);
  turns.push({ role: 'user', content: COACH_RULES + '\n\n[TABLE]\n' + handState() + '\n\n[QUESTION]\n' + question });
  sampler(turns, { cache: false, modelTier: 'default', onText: function (ev) {
    body.innerHTML = fmt(ev.text);
    $('#thread').scrollTop = $('#thread').scrollHeight;
  } }).then(function (res) {
    body.innerHTML = fmt(res.text);
    chat.push({ role: 'user', content: question });
    chat.push({ role: 'assistant', content: res.text });
  }).catch(function (err) {
    body.innerHTML = fmt(err && err.code === 'rate_limited'
      ? 'Too many questions at once — give it a moment and ask again.'
      : 'The coach could not answer that one. The counting on the table still holds.');
  }).then(function () { asking = false; $('#askBtn').disabled = false; });
}
function coachUnavailable() {
  $('#askRow').hidden = true;
  $('#thread').hidden = true;
  $('#prompts').hidden = true;
  $('#prompts').innerHTML = '';
  $('#coachOffline').hidden = false;
  $('#coachOffline').textContent = 'The chat coach is not available in this view. The table and its ' +
    'counting are computed on this page and still work.';
}

/* ---- the dragon's swim ----
   A serpent, not a koi. The koi model had no path at all: a head wandered and the body was
   the record of where it had been, which let the spine turn back on itself -- and the frame
   it did, the drawing was belly-up, because the renderer maps the sprite's belly-ward axis
   to one side of the direction of travel. So the spine is a function now. Height is read
   off distance behind the head and x is solved from it, falling at every joint; a body that
   cannot double back cannot turn over.
   Two motions are layered on that axis. The head wanders slowly over the stage, and each
   station behind it replays the head's height from LAG_S * (its share of the body) ago, so
   a rise at the head rolls down the length -- the head leads and the body follows it. Over
   that runs the undulation, ramped from almost nothing at the head to its full swing by the
   tail, travelling backwards the way a swimming animal's does. */
function mountDragonSwim(hero, {
  imageUrl = 'dragon.webp',
  onState = () => {},
} = {}) {
  const canvas = document.createElement('canvas');
  canvas.className = 'dragon-swim';
  canvas.setAttribute('aria-hidden', 'true');
  /* A mesh, not a stack of blitted strips. The body is one triangle strip whose vertices
     ride the spine, so the artwork is sampled once per pixel however hard the body bends --
     no overdraw, no seams to hide, and the whole thing is one draw call a frame. */
  const gl = canvas.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: true })
    || canvas.getContext('experimental-webgl', { alpha: true, antialias: true, premultipliedAlpha: true });
  if (!gl) return () => {};

  const VERT = `
    attribute vec2 a_pos;
    attribute vec2 a_uv;
    uniform vec2 u_res;
    varying vec2 v_uv;
    void main() {
      vec2 c = a_pos / u_res * 2.0 - 1.0;
      gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
      v_uv = a_uv;
    }`;
  const FRAG = `
    precision mediump float;
    uniform sampler2D u_tex;
    uniform float u_alpha;
    varying vec2 v_uv;
    void main() {
      gl_FragColor = texture2D(u_tex, v_uv) * u_alpha;
    }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { gl.deleteShader(sh); return null; }
    return sh;
  }
  const vs = compile(gl.VERTEX_SHADER, VERT), fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return () => {};
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return () => {};
  gl.useProgram(prog);
  const aPos = gl.getAttribLocation(prog, 'a_pos');
  const aUv = gl.getAttribLocation(prog, 'a_uv');
  const uRes = gl.getUniformLocation(prog, 'u_res');
  const uAlpha = gl.getUniformLocation(prog, 'u_alpha');
  /* The texture is uploaded with its alpha already multiplied in, so a half-transparent
     edge pixel carries half its colour and the scales never fringe against the red. */
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0, 0, 0, 0);

  const image = new Image();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  /* The artwork runs head-right along a horizontal axis. The mesh reads it directly:
     across the body is the image's height, along the body its width, head at u = 1. */
  let texture = null, spriteW = 0, spriteH = 0;
  function buildTexture() {
    const W = image.naturalWidth, H = image.naturalHeight;
    if (!W || !H) return false;
    spriteH = W;   /* along the body */
    spriteW = H;   /* across it */
    texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return true;
  }

  const N = 73;
  /* The wave, in fractions of the body: how far the spine swings off its axis, how many
     crests lie along it, how fast it beats, and how much of the swing the head itself
     takes. AMP * 2pi * WAVES is the steepest the spine can get and has to stay below 1 --
     at 1 a joint would have to rise its own length and the body would stand on end. */
  const AMP = .092, WAVES = 1.25, OMEGA = 1.2, HEAD_AMP = .22;
  /* What the reference drawings have in common, and the plain wave did not: the head is
     carried clear of the body on a neck that is nearly straight, the swing builds up
     behind that neck rather than being shared equally along the body, and the last of the
     tail lifts and flares. LIFT and TAIL are shares of a body length; NECK is how far
     back along the body the head's carriage has died away to nothing. */
  const NECK = .26, LIFT = .06, TAIL = .03;
  /* Coming about, it gathers itself rather than being squeezed flat: the head rears by
     REAR of a body length and the body takes a curve CURL deeper than its cruising one,
     which is the shape the turning poses are drawn in. The deeper curve is carried by
     the middle of the body, not the front -- stacked on the neck's own rise it is more
     than a joint can take, and the body bunches instead of bending. */
  const REAR = .085, CURL = .45;
  /* Seconds for a movement of the head to reach the tail, and the share of a segment's
     length that movement is allowed to spend on rising. The lag is in seconds, so a
     slower dragon needs a longer one to put the same length of body through the bend. */
  const LAG_S = 1.35, CLIMB = .34;
  /* How far the drawing reaches from the spine, as a fraction of the sprite's width. It is
     measured off the artwork's own alpha, which fills only .15 to .82 of the box it sits in. */
  const INK = .36;
  /* Cruising speed in body lengths a second, how long a turn takes, and how thin the body
     is allowed to get at the moment it is edge-on to you. */
  const CRUISE = .13, TURN_S = 2.1, MIN_SQUASH = .13;

  const pts = [];
  for (let i = 0; i < N; i++) pts.push({ x: 0, y: 0 });
  /* The head's height, held back in STAGES steps: each one chases the one in front with a
     time constant of LAG_S/STAGES, so stage k is the head as it was k of those ago and the
     last is a whole LAG_S behind. The body is then drawn through those past heights, which
     is what makes the head lead and every stretch of body arrive where the head has been. */
  const STAGES = 8;
  const lagY = new Float64Array(STAGES + 1);

  /* one vertex pair per station: the strip runs head to tail, top edge and bottom edge */
  const verts = new Float32Array(N * 4);
  const uvs = new Float32Array(N * 4);
  for (let i = 0; i < N; i++) {
    const u = 1 - i / (N - 1);
    uvs[i * 4] = u; uvs[i * 4 + 1] = 0;
    uvs[i * 4 + 2] = u; uvs[i * 4 + 3] = 1;
  }
  const posBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const uvBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
  gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);

  let raf, scale, segLen, last, maxBend, cssW = 0, cssH = 0;
  let hx = 0, hy = 0, wantY = 0, wanderT = 0, phase = 0, seeded = false;
  /* squash is the body seen end-on: +1 is broadside facing right, -1 broadside facing left,
     and the way through zero is the dragon turning its length away from you. */
  let dir = -1, squash = -1, turning = false, turnT = 0, turnFrom = -1, gather = 0;
  let disposed = false;
  const observer = new ResizeObserver(resize);
  hero.append(canvas);
  observer.observe(hero);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

  /* Where the head may go. Top and bottom keep the drawing's reach off the spine, plus the
     swing of the wave, clear of the edge. Sideways the head turns well inside the frame, so
     the turn itself is on stage and only the thin end of the tail ever leaves it. */
  function bounds(w, h) {
    const L = spriteH * scale;
    const half = spriteW * INK * scale + AMP * L + Math.max(LIFT, TAIL) * L;
    const swing = Math.min(Math.max(0, h / 2 - half), L * .7);
    return { xLo: w * .27, xHi: w * .73, yLo: h / 2 - swing, yHi: h / 2 + swing };
  }

  function seed(w, h) {
    const b = bounds(w, h);
    hx = (b.xLo + b.xHi) / 2;
    hy = wantY = (b.yLo + b.yHi) / 2;
    wanderT = rnd(1, 3);
    lagY.fill(hy);
    seeded = true;
  }

  function resize() {
    cssW = hero.clientWidth;
    cssH = hero.clientHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (!spriteH) return;
    /* The body lies across the stage, so its length is bounded by the width and its
       thickness by the height. */
    scale = Math.min(cssH * .78 / spriteH, cssW * .42 / spriteW);
    segLen = spriteH * scale / (N - 1);
    /* The tightest turn a joint may take. A ribbon bent to a radius under its own half
       width folds through itself on the inside, and what comes out is the body smearing
       rather than bending. INK * spriteW is how far the drawing reaches from the spine. */
    maxBend = (spriteH / (N - 1)) / (INK * spriteW * 1.3);
    if (!seeded) seed(cssW, cssH);
  }

  /* the head's height as it was `u` of the way back through LAG_S */
  function trail(u) {
    const f = u * STAGES, j = Math.min(STAGES - 1, Math.floor(f));
    return lagY[j] + (lagY[j + 1] - lagY[j]) * (f - j);
  }

  function step(dt, w, h) {
    const b = bounds(w, h);
    const L = spriteH * scale;

    /* up and down: a new height to make for every few seconds, reached at a rate the body
       can actually pass backwards -- climb faster than that and the spine would have to
       stand on end to keep hold of the head's path. */
    wanderT -= dt;
    if (wanderT <= 0) { wantY = rnd(b.yLo, b.yHi); wanderT = rnd(2.6, 5.5); }
    const e = 1 - Math.exp(-dt * .5);
    const vy = L * CLIMB / LAG_S * dt;
    if (vy > 0) hy += vy * Math.tanh((clamp(wantY, b.yLo, b.yHi) - hy) * e / vy);

    /* Along: cruise, then roll over and come back. The turn is a yaw -- the body
       foreshortens to nothing and opens out the other way, the way a fish turns at the
       glass, rather than the drawing flipping on the spot.
       It rolls into it rather than arriving at it. The same cosine that swings the body
       round also scales the speed along, so the dragon runs down to a standstill as it
       comes side-on and gathers way again out of it, with no step in the speed at either
       end. That costs it a length of run, so the turn is called early by exactly the
       distance it takes to stop -- the integral of the cosine over half a turn. */
    const speed = CRUISE * L, brake = speed * TURN_S / Math.PI;
    if (!turning) {
      hx += dir * speed * dt;
      if ((dir > 0 && hx >= b.xHi - brake) || (dir < 0 && hx <= b.xLo + brake)) {
        turning = true; turnT = 0; turnFrom = dir;
      }
    } else {
      turnT += dt;
      const t = Math.min(turnT / TURN_S, 1);
      const c = Math.cos(t * Math.PI);
      squash = turnFrom * (Math.abs(c) < MIN_SQUASH ? (c < 0 ? -1 : 1) * MIN_SQUASH : c);
      dir = squash < 0 ? -1 : 1;
      hx += dir * speed * dt * Math.abs(c);
      /* The gathering follows how broadside the body still is, not how far through
         the turn it is: deepening the curve hardest at the moment the body is
         edge-on would fold it into a concertina, where there is least room for it
         and least of it to see. So it curves into the turn, runs straight through
         the edge-on moment, and curves out of it. */
      gather = Math.min(1, 2 * Math.sin(t * Math.PI) * Math.abs(c));
      if (t >= 1) { turning = false; squash = -turnFrom; dir = squash; gather = 0; }
    }
    hx = clamp(hx, b.xLo - L * .05, b.xHi + L * .05);

    lagY[0] = hy;
    const k = 1 - Math.exp(-dt * STAGES / LAG_S);
    for (let i = 1; i <= STAGES; i++) lagY[i] += (lagY[i - 1] - lagY[i]) * k;
    phase += dt * OMEGA;

    /* The spine, laid out head first in its own frame: the body always trails off in -x
       from the head, and the screen is given the mirror of it when the dragon faces left.
       x is what is left of a segment once the rise is taken out of it, so every joint is
       exactly one segment long however hard the body is bending -- which is what stops it
       ever doubling back on itself and spreading out. */
    const amp = AMP * L, K = 2 * Math.PI * WAVES;
    const lift = LIFT * L, flare = TAIL * L;
    let x = hx, prevY = 0;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      /* the swing is slight at the head and full by the middle, rather than growing
         evenly all the way down -- which is what makes the head lead and not wag */
      const swing = HEAD_AMP + (1 - HEAD_AMP) * Math.pow(u, .75);
      /* the neck, raised at the head and level again a quarter of the way back */
      const neck = u < NECK ? lift * .5 * (1 + Math.cos(Math.PI * u / NECK)) : 0;
      /* and the flare of the tail over the last fifth */
      const tip = u > .8 ? flare * .5 * (1 - Math.cos(Math.PI * (u - .8) / .2)) : 0;
      /* and, mid-turn, the rear of the head and the deeper curve through the front */
      const rear = gather * REAR * L * (u < .55 ? .5 * (1 + Math.cos(Math.PI * u / .55)) : 0);
      const deep = 1 + gather * CURL * Math.sin(Math.PI * clamp((u - NECK) / .54, 0, 1));
      const y = trail(u) + amp * swing * deep * Math.sin(phase - u * K) - neck - tip - rear;
      if (i) {
        const dy = y - prevY;
        x -= Math.sqrt(Math.max(segLen * segLen - dy * dy, 0));
      }
      pts[i].x = x; pts[i].y = y;
      prevY = y;
    }
    /* Hold every joint inside that turn. The wave on its own stays within it; this bites
       only where the head's swing and its climb stack on top of the wave, and rounds those
       moments off instead of letting the body fold through itself. */
    let ang = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
    for (let i = 1; i < N - 1; i++) {
      const want = Math.atan2(pts[i + 1].y - pts[i].y, pts[i + 1].x - pts[i].x);
      ang += clamp(wrap(want - ang), -maxBend, maxBend);
      pts[i + 1].x = pts[i].x + Math.cos(ang) * segLen;
      pts[i + 1].y = pts[i].y + Math.sin(ang) * segLen;
    }
  }

  /* The spine becomes a ribbon: at each station a normal to the body, and a vertex out to
     either edge of the artwork. The spine sits at .49 of the drawing's thickness, which is
     where the backbone falls in the art. */
  function build() {
    const side = squash < 0 ? -1 : 1;
    /* Turning away shortens what you see of the body along its length. It does not
       shorten it up and down -- that is square to the axis it is turning about -- and
       halving the wave there was what made the turn read as a squeeze. */
    const across = spriteW * scale;
    const top = -.49 * across * side, bot = .51 * across * side;
    let px = 0, py = 0;
    for (let i = 0; i < N; i++) {
      const X = hx + squash * (pts[i].x - hx);
      const Y = pts[i].y;
      if (i) {
        let dx = X - px, dy = Y - py;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        /* the station behind takes the direction it was reached by */
        verts[(i - 1) * 4] = px + dy * top; verts[(i - 1) * 4 + 1] = py - dx * top;
        verts[(i - 1) * 4 + 2] = px + dy * bot; verts[(i - 1) * 4 + 3] = py - dx * bot;
        if (i === N - 1) {
          verts[i * 4] = X + dy * top; verts[i * 4 + 1] = Y - dx * top;
          verts[i * 4 + 2] = X + dy * bot; verts[i * 4 + 3] = Y - dx * bot;
        }
      }
      px = X; py = Y;
    }
  }

  function frame(now) {
    const w = hero.clientWidth, h = hero.clientHeight;
    if (w !== cssW || h !== cssH) resize();
    const dt = clamp((now - (last ?? now)) / 1000, 0, .05);
    last = now;
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (texture && scale > 0) {
      step(dt, w, h);
      build();
      gl.useProgram(prog);
      gl.uniform2f(uRes, w, h);
      gl.uniform1f(uAlpha, 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
      gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, N * 2);
    }
    raf = requestAnimationFrame(frame);
  }

  function syncMotion() {
    cancelAnimationFrame(raf);
    last = undefined;
    gl.clear(gl.COLOR_BUFFER_BIT);
    if (reduced.matches || !image.naturalWidth || disposed) { onState(false); return; }
    if (!texture && !buildTexture()) { onState(false); return; }
    resize();
    onState(true);
    raf = requestAnimationFrame(frame);
  }

  reduced.addEventListener('change', syncMotion);
  image.onload = syncMotion;
  image.src = imageUrl;
  return () => {
    disposed = true;
    cancelAnimationFrame(raf);
    observer.disconnect();
    reduced.removeEventListener('change', syncMotion);
    image.onload = null;
    canvas.remove();
    onState(false);
  };
}

/* ---- boot ---- */
function boot(saved) {
  renderWord('#wordA', 'MAHJONG', 0);
  renderWord('#wordB', 'GPT', 7);
  /* The dragon waits for the title: one source of truth for when that is, so changing
     the wordmark cannot leave it coming in over the letters. */
  var letters = 'MAHJONG'.length + 'GPT'.length;
  document.documentElement.style.setProperty('--after-title',
    (RISE_FROM + (letters - 1) * RISE_STEP + RISE_DUR).toFixed(3) + 's');
  $('#menuBtn').addEventListener('click', function () { setMenu($('#menu').hidden); });
  $('#menu').addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    setMenu(false);
    var href = a.getAttribute('href');
    /* Play is the game and Ask Mahjong GPT is the coach, each a page of its own next to
       this one, with its own way back here. The blank page is now only ever the fallback
       for a link with nowhere to go. */
    if (href === '#play') { location.href = 'play/index.html'; return; }
    if (href === '#instructions') { location.href = 'play/index.html#instructions'; return; }
    if (href === '#gpt') { location.href = 'play/index.html#gpt'; return; }
    $('#blankPage').hidden = href === '#home';
    if (href !== '#home') return;
    /* the target may not be on the page; closing the menu is then the whole action */
    var el = document.querySelector(href);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    setMenu(false);
    $('#blankPage').hidden = true;
  });

  /* The dragon swims across the hero. The flat-sprite version that used to live here is
     the commented-out markup and the mountDragonSwim above it; the swim is now a three.js
     mesh deformed along a spine, which arrives as a module and so is mounted at the foot
     of this file rather than from here. The old one is left in place, not deleted. */

  /* The table, the coach and the reference were taken off the page. Their code is left in
     place so they can be put back, but with only the hero in the document every lookup
     below would be null. */
  if (!$('#play')) return;

  renderFaanRef();
  $('#startBtn').addEventListener('click', function () {
    $('#play').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#newGame').addEventListener('click', newHand);
  $('#askInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') ask(this.value); });
  $('#askBtn').addEventListener('click', function () { ask($('#askInput').value); });

  newHand();

  $('#askRow').hidden = true;
  $('#coachOffline').hidden = false;
  $('#coachOffline').innerHTML = 'Connecting to the coach<span class="dots"></span>';
  if (window.claude && window.claude.use) {
    window.claude.use('sample').then(function (s) {
      if (!s) return coachUnavailable();
      sampler = s;
      $('#askRow').hidden = false;
      $('#coachOffline').hidden = true;
      renderPrompts();
      bubble('assistant', fmt('I can see your hand, what everyone has thrown, and the exact counting ' +
        'behind it. Ask me what to throw, whether to claim, or how the faan would add up — in English or Cantonese.'));
    }).catch(coachUnavailable);
  } else {
    coachUnavailable();
  }
}
boot(null);

<!-- The dragon swims through the wordmark. The frame it lives in cannot see these letters,
     so the page draws them for it: a mask, white on nothing, measured letter by letter
     where they actually sit, so it lands on them whatever the type is doing. The frame
     uses it as depth, not as paint: anything behind a letter is never drawn, and the
     letter underneath shows through. -->
<script>
(() => {
  const frame = document.querySelector('.dragon-stage'), hero = document.querySelector('.hero');
  if (!frame || !hero) return;
  let canvas;
  window.__heroMask = () => {
    const r = hero.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas = canvas || document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, r.width, r.height);
    g.fillStyle = '#fff';
    g.textBaseline = 'alphabetic';
    for (const el of hero.querySelectorAll('.hero-stage i')) {
      const b = el.getBoundingClientRect(), cs = getComputedStyle(el);
      g.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      const m = g.measureText(el.textContent);
      /* half-leading: the glyph box sits centred in the line box the letter reports */
      const base = b.top - r.top + (b.height - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2
        + m.fontBoundingBoxAscent;
      g.fillText(el.textContent, b.left - r.left, base);
    }
    return canvas;
  };
  const tell = () => { try { frame.contentWindow.__heroMaskChanged(); } catch { /* not ready */ } };
  let t; const refresh = () => { clearTimeout(t); t = setTimeout(tell, 120); };
  addEventListener('resize', refresh);
  if (document.fonts) document.fonts.ready.then(refresh);
  setTimeout(refresh, 2300);   /* once the letters have settled where they belong */
})();
</script>
