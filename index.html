<title>MahjongGPT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a lacquer table. Giant Didone sets the name, mono carries every label and
   number, and the hand you are playing sits on it as pale paper objects. */
:root{
  /* The ground, read off the dragon photograph: a deep lacquer that falls away to
     near-black at the edges, rather than the brighter vermilion it was. */
  --lacquer:#9c0400; --lacquer-deep:#6e0200;
  /* The ground is a slow gradient over a narrow range of red -- about forty levels
     across a whole screen -- so eight-bit colour lays it down in visible bands. A
     faint grain over the top dithers them away; it is too fine to read as texture. */
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.055'/></svg>");
  --ground:var(--grain) repeat,radial-gradient(118% 92% at 50% 44%,var(--lacquer) 0%,var(--lacquer) 34%,var(--lacquer-deep) 100%);
  --chalk:#e9e6e6;
  --display:'Instrument Serif','Didot','Bodoni MT',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* white scrollbar on the lacquer */
html{scrollbar-color:#fff rgba(0,0,0,.28);scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.28)}
::-webkit-scrollbar-thumb{background:#fff;border-radius:999px;border:2px solid rgba(0,0,0,.28);
  background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#fff;background-clip:padding-box}
::-webkit-scrollbar-corner{background:rgba(0,0,0,.28)}
html,body{background:var(--lacquer)}
body{color:var(--chalk);font-family:var(--mono);font-size:13.5px;line-height:1.6;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--chalk);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- hero: the name, nothing else ---- */
.hero{position:relative;width:100%;height:100vh;height:100dvh;min-height:320px;overflow:hidden;
  isolation:isolate;
  background:var(--ground);user-select:none;-webkit-user-select:none}
.hero-centre{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
@keyframes settleIn{from{opacity:0}}
/* The dragon waits for the T to land -- it is the last letter, so that is also when the
   wordmark is done. --after-title is set in JS from the same constants that stagger the
   letters, so it cannot drift if the wordmark changes. `backwards` holds it at zero
   through the wait; under reduced motion the title does not rise, so neither does it. */
@media (prefers-reduced-motion:no-preference){
  .dragon-stage{
    animation:settleIn .8s ease-out var(--after-title,1.455s) backwards}
}
/* The dragon as supplied: a page of its own, running its own scene, carried on the hero
   in a frame of its own. ?embed drops its chrome and its backdrop, so what is left is the
   creature on this page's red. It is in front of the wordmark, as the one before it was.
   It takes no input at all: this is a creature swimming past, not a toy to be handled, and
   a frame that answered the pointer would swallow a drag across the hero -- which on a
   touch screen is the page being scrolled. */
.dragon-stage{position:absolute;inset:0;width:100%;height:100%;z-index:3;border:0;
  background:transparent;pointer-events:none}
@media (prefers-reduced-motion:reduce){.dragon-stage{display:none}}
.hero-stage{position:relative;font-family:var(--display);font-weight:400;color:#fff;
  text-transform:uppercase;line-height:.98;letter-spacing:-.045em;
  --dfs:min(24.25vw,43vh);font-size:var(--dfs)}
.hero-line{display:block;position:relative;white-space:nowrap}
.hero-row-b{position:relative;text-align:center}
.hero-line.b{position:relative;display:inline-block}
/* each letter rises out of a clipped word box, 45ms apart */
/* The clip is what hides the letters until they rise into the line. Its bottom used
   to sit exactly on the box, which cut the word's own shadow off in a straight line
   across the red -- the shadow falls 10px with a 26px blur, so it needs the room. */
.word{display:block;clip-path:inset(-50% -.5em -48px);margin-bottom:-.08em;padding-bottom:.08em;padding-right:.08em;
  text-shadow:0 10px 26px rgba(32,2,0,.42),0 2px 4px rgba(32,2,0,.3)}
.word i{display:inline-block;font-style:normal}
@media (prefers-reduced-motion:no-preference){
  /* No will-change here. It gave every letter a layer of its own, and the word's soft
     shadow was then cut off square at each letter's layer edge -- which drew a row of
     rectangles on the ground behind the type. The browser promotes a running transform
     animation anyway, so the hint bought nothing and the layers were never given back. */
  .word i{transform:translateY(110%);opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes rise{to{transform:none;opacity:1}}
}
.ui-tr{right:max(2.5vw,env(safe-area-inset-right,0px));top:max(2.5vw,env(safe-area-inset-top,0px))}
/* ---- menu button and the full-screen menu it opens ---- */
.menu-btn{position:fixed;z-index:40;display:inline-flex;align-items:center;justify-content:center;
  border-radius:max(8px,.75vw);width:max(44px,4vw);height:max(44px,4vw);
  background:#fff;color:#202020;border:0;cursor:pointer;transition:background .15s ease,transform .1s ease}
.menu-btn:hover{background:#e9e6e6}
.menu-btn:active{transform:scale(.95)}
.menu-btn svg{width:42%;height:42%}
.menu{position:fixed;inset:0;z-index:35;display:flex;align-items:center;
  background:var(--ground)}
.menu-body{width:100%;max-width:none;padding:0 6vw 0 11vw}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.2vw}
.menu a{display:inline-block;font-family:var(--display);font-weight:400;color:#fff;
  font-size:min(9vw,14vh);line-height:1;letter-spacing:0;text-transform:uppercase;
  text-decoration:none;transition:transform .15s ease,opacity .15s ease}
.menu a:hover{transform:translateX(.05em);opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .menu li{opacity:0;animation:menuIn .45s ease-out forwards}
  @keyframes menuIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}
/* Everything but Home goes to a blank red page. It covers the hero but stays under the menu
   button and the menu itself, so the only thing on it is the hamburger, and the menu is the
   way off. */
.blank-page{position:fixed;inset:0;z-index:32;background:var(--ground)}
@media (max-width:640px){
  .menu-body{max-width:100vw;padding:0 max(16px,env(safe-area-inset-left,0px))}
  .menu ul{gap:2.2vh}
  .menu a{font-size:clamp(2rem,12vw,9vh)}
  .hero-stage{--dfs:23.3vw}
  .ui-tr{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-height:480px){.hero-stage{--dfs:min(24.25vw,36vh)}}
</style>

<div class="blank-page" id="blankPage" hidden></div>

<header class="hero" id="home">

  <iframe class="dragon-stage" src="dragon.html?embed" title="Imperial dragon"
    aria-hidden="true" tabindex="-1" scrolling="no"></iframe>
  <div class="hero-centre">
    <div class="hero-stage">
      <span class="hero-line a"><span class="word" id="wordA">MAHJONG</span></span>
      <div class="hero-row-b">
        <span class="hero-line b"><span class="word" id="wordB">GPT</span></span>
      </div>
    </div>
  </div>
</header>




<script>
var $ = function (s) { return document.querySelector(s); };

/* Splitting a word into elements throws away the font's kerning, so the pairs that
   relied on it collide at koi's -.045em tracking: J hooks .056em left of its own
   origin to tuck under the H, and T's crossbar reaches back under P's bowl at the
   same height as the bowl itself. Keyed by pair, and measured: each value is what
   it takes to land that pair's ink gap near .017em, where the untouched pairs sit. */
var KERN = { MA: 0.063, AH: 0.058, HJ: 0.03, PT: 0.02 };
var RISE_FROM = 0.15, RISE_STEP = 0.045, RISE_DUR = 0.9;
function renderWord(id, text, offset) {
  var host = $(id);
  host.textContent = '';
  text.split('').forEach(function (ch, i) {
    var el = document.createElement('i');
    el.textContent = ch;
    var k = i && KERN[text[i - 1] + ch];
    if (k) el.style.marginLeft = k + 'em';
    el.style.animationDelay = (RISE_FROM + (offset + i) * RISE_STEP).toFixed(3) + 's';
    host.appendChild(el);
  });
}

/* ---- menu ---- */
/* overflow:hidden alone still lets iOS drag the page under the overlay, so the body is
   pinned at its current offset and put back where it was on close */
var menuScrollY = 0;
function setMenu(open) {
  var m = $('#menu'), b = $('#menuBtn'), body = document.body;
  if (open && m.hidden) menuScrollY = window.scrollY;
  m.hidden = !open;
  document.documentElement.style.overflow = open ? 'hidden' : '';
  body.style.position = open ? 'fixed' : '';
  body.style.top = open ? -menuScrollY + 'px' : '';
  body.style.left = open ? '0' : '';
  body.style.right = open ? '0' : '';
  if (!open) window.scrollTo(0, menuScrollY);
  b.setAttribute('aria-expanded', String(open));
  b.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  $('#menuIcon').setAttribute('d', open ? 'M5 5l14 14M19 5 5 19' : 'M3 6h18M3 12h18M3 18h18');
}

/* ---- boot ---- */
function boot() {
  renderWord('#wordA', 'MAHJONG', 0);
  renderWord('#wordB', 'GPT', 7);
  /* The dragon waits for the title: one source of truth for when that is, so changing
     the wordmark cannot leave it coming in over the letters. */
  var letters = 'MAHJONG'.length + 'GPT'.length;
  document.documentElement.style.setProperty('--after-title',
    (RISE_FROM + (letters - 1) * RISE_STEP + RISE_DUR).toFixed(3) + 's');
  $('#menuBtn').addEventListener('click', function () { setMenu($('#menu').hidden); });
  $('#menu').addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    setMenu(false);
    var href = a.getAttribute('href');
    /* Play is the game and Ask Mahjong GPT is the coach, each a page of its own next to
       this one, with its own way back here. The blank page is now only ever the fallback
       for a link with nowhere to go. */
    if (href === '#play') { location.href = 'play/index.html'; return; }
    if (href === '#instructions') { location.href = 'play/index.html#instructions'; return; }
    if (href === '#gpt') { location.href = 'play/index.html#gpt'; return; }
    $('#blankPage').hidden = href === '#home';
    if (href !== '#home') return;
    /* the target may not be on the page; closing the menu is then the whole action */
    var el = document.querySelector(href);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    setMenu(false);
    $('#blankPage').hidden = true;
  });
}
boot();

</script>

<!-- The dragon swims through the wordmark. The frame it lives in cannot see these letters,
     so the page draws them for it: a mask, white on nothing, measured letter by letter
     where they actually sit, so it lands on them whatever the type is doing. The frame
     uses it as depth, not as paint: anything behind a letter is never drawn, and the
     letter underneath shows through. -->
<script>
(() => {
  const frame = document.querySelector('.dragon-stage'), hero = document.querySelector('.hero');
  if (!frame || !hero) return;
  let canvas;
  window.__heroMask = () => {
    const r = hero.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas = canvas || document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, r.width, r.height);
    g.fillStyle = '#fff';
    g.textBaseline = 'alphabetic';
    for (const el of hero.querySelectorAll('.hero-stage i')) {
      const b = el.getBoundingClientRect(), cs = getComputedStyle(el);
      g.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      const m = g.measureText(el.textContent);
      /* half-leading: the glyph box sits centred in the line box the letter reports */
      const base = b.top - r.top + (b.height - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2
        + m.fontBoundingBoxAscent;
      g.fillText(el.textContent, b.left - r.left, base);
    }
    return canvas;
  };
  const tell = () => { try { frame.contentWindow.__heroMaskChanged(); } catch { /* not ready */ } };
  let t; const refresh = () => { clearTimeout(t); t = setTimeout(tell, 120); };
  addEventListener('resize', refresh);
  if (document.fonts) document.fonts.ready.then(refresh);
  setTimeout(refresh, 2300);   /* once the letters have settled where they belong */
})();
</script>
